<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Neon Dash · Esquiva y Recoge</title>
<style>
  :root{
    --bg1:#0a0118;
    --bg2:#150a2e;
    --neon-pink:#ff2d95;
    --neon-cyan:#00f0ff;
    --neon-yellow:#ffe93f;
    --neon-green:#39ff88;
    --text:#eafcff;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    height:100%;
    background:radial-gradient(ellipse at center, var(--bg2) 0%, var(--bg1) 70%);
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    overflow:hidden;
    color:var(--text);
    touch-action:none;
    user-select:none;
  }
  #app{
    position:relative;
    width:100vw;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  #gameCanvas{
    background:transparent;
    display:block;
    touch-action:none;
    border-radius:12px;
  }
  #frame{
    position:relative;
    border-radius:16px;
    box-shadow:
      0 0 0 2px rgba(0,240,255,0.35),
      0 0 25px rgba(0,240,255,0.25),
      0 0 80px rgba(255,45,149,0.15) inset;
    overflow:hidden;
  }

  /* HUD */
  #hud{
    position:absolute;
    top:0; left:0; right:0;
    display:flex;
    justify-content:space-between;
    padding:14px 20px;
    font-size:15px;
    letter-spacing:1px;
    z-index:5;
    pointer-events:none;
    text-shadow:0 0 8px rgba(0,240,255,0.8);
  }
  #hud .stat{ display:flex; flex-direction:column; align-items:flex-start; }
  #hud .stat.right{ align-items:flex-end; }
  #hud .label{ font-size:10px; opacity:.6; text-transform:uppercase; letter-spacing:2px;}
  #hud .value{ font-size:22px; font-weight:700; color:var(--neon-cyan); }
  #hud .value.combo{ color:var(--neon-yellow); }
  #lives{ display:flex; gap:6px; margin-top:2px;}
  .heart{
    width:14px; height:14px;
    background:var(--neon-pink);
    clip-path: path('M7 13 C -2 6 1 -1 7 3 C 13 -1 16 6 7 13 Z');
    filter:drop-shadow(0 0 4px var(--neon-pink));
  }
  .heart.lost{ background:#333; filter:none; opacity:.3;}

  /* Overlays */
  .overlay{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(6,2,20,0.82);
    backdrop-filter:blur(3px);
    z-index:20;
    text-align:center;
    padding:20px;
    gap:14px;
  }
  .overlay.hidden{ display:none; }
  .title{
    font-size:clamp(28px, 6vw, 48px);
    font-weight:800;
    background:linear-gradient(90deg, var(--neon-cyan), var(--neon-pink));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    filter:drop-shadow(0 0 18px rgba(0,240,255,0.5));
    letter-spacing:2px;
  }
  .subtitle{ font-size:14px; opacity:.75; max-width:420px; line-height:1.5; }
  .kbd{
    display:inline-block;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.25);
    border-radius:6px;
    padding:2px 8px;
    font-size:12px;
    margin:0 2px;
  }
  button.btn{
    margin-top:8px;
    background:linear-gradient(90deg, var(--neon-cyan), var(--neon-pink));
    border:none;
    color:#04040c;
    font-weight:800;
    font-size:16px;
    padding:12px 34px;
    border-radius:30px;
    cursor:pointer;
    letter-spacing:1px;
    box-shadow:0 0 20px rgba(255,45,149,0.5), 0 0 20px rgba(0,240,255,0.35);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  button.btn:hover{ transform:scale(1.06); box-shadow:0 0 30px rgba(255,45,149,0.7), 0 0 30px rgba(0,240,255,0.5); }
  button.btn:active{ transform:scale(0.97); }
  .score-big{ font-size:40px; font-weight:800; color:var(--neon-yellow); text-shadow:0 0 14px rgba(255,233,63,0.7); }
  .best{ font-size:13px; opacity:.8; }
  .tag{ font-size:11px; opacity:.5; margin-top:2px;}

  /* Mobile touch controls */
  #touchControls{
    position:absolute;
    bottom:14px; left:0; right:0;
    display:none;
    justify-content:center;
    gap:16px;
    z-index:10;
  }
  #touchControls.show{ display:flex; }
  .tbtn{
    width:56px; height:56px;
    border-radius:50%;
    background:rgba(0,240,255,0.12);
    border:1px solid rgba(0,240,255,0.4);
    color:var(--neon-cyan);
    font-size:22px;
    display:flex; align-items:center; justify-content:center;
    backdrop-filter:blur(4px);
  }

  #pauseHint{
    position:absolute; bottom:10px; right:14px;
    font-size:11px; opacity:.4; z-index:5; pointer-events:none;
  }

  @media (max-width:600px){
    #hud{ padding:10px 14px; font-size:12px;}
    #hud .value{ font-size:18px;}
    #pauseHint{ display:none; }
  }
</style>
</head>
<body>

<div id="app">
  <div id="frame">
    <canvas id="gameCanvas"></canvas>

    <div id="hud">
      <div class="stat">
        <span class="label">Puntos</span>
        <span class="value" id="scoreVal">0</span>
      </div>
      <div class="stat">
        <span class="label">Combo</span>
        <span class="value combo" id="comboVal">x1</span>
      </div>
      <div class="stat right">
        <span class="label">Vidas</span>
        <div id="lives"></div>
      </div>
    </div>

    <div id="pauseHint">Pausa: <span class="kbd">P</span> / <span class="kbd">Esc</span></div>

    <div id="touchControls">
      <div class="tbtn" id="tLeft">◀</div>
      <div class="tbtn" id="tUp">▲</div>
      <div class="tbtn" id="tDown">▼</div>
      <div class="tbtn" id="tRight">▶</div>
    </div>

    <!-- START SCREEN -->
    <div class="overlay" id="startScreen">
      <div class="title">NEON DASH</div>
      <div class="subtitle">
        Mueve tu orbe con <span class="kbd">←</span><span class="kbd">↑</span><span class="kbd">↓</span><span class="kbd">→</span>
        o <span class="kbd">WASD</span>. Esquiva los bloques rojos, recoge las gemas cian para sumar
        puntos y mantén el combo activo. ¡Tienes 3 vidas!
      </div>
      <button class="btn" id="startBtn">JUGAR</button>
      <div class="tag">También funciona con controles táctiles en móvil</div>
    </div>

    <!-- PAUSE SCREEN -->
    <div class="overlay hidden" id="pauseScreen">
      <div class="title" style="font-size:32px;">PAUSA</div>
      <button class="btn" id="resumeBtn">CONTINUAR</button>
    </div>

    <!-- GAME OVER SCREEN -->
    <div class="overlay hidden" id="overScreen">
      <div class="title" style="font-size:32px;">GAME OVER</div>
      <div class="score-big" id="finalScore">0</div>
      <div class="best" id="bestScore">Mejor puntaje: 0</div>
      <button class="btn" id="retryBtn">JUGAR DE NUEVO</button>
    </div>

  </div>
</div>

<script>
(() => {
  "use strict";

  /* ---------- Setup ---------- */
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const frame = document.getElementById('frame');

  function computeSize(){
    const maxW = Math.min(window.innerWidth - 20, 520);
    const maxH = Math.min(window.innerHeight - 20, 760);
    // keep a nice portrait-ish ratio
    let w = maxW;
    let h = Math.min(maxH, w * 1.45);
    if (h < maxH && (h / w) < 1.45) { /* fine */ }
    return {w: Math.floor(w), h: Math.floor(h)};
  }
  let {w: CW, h: CH} = computeSize();
  canvas.width = CW; canvas.height = CH;
  frame.style.width = CW + 'px';
  frame.style.height = CH + 'px';

  window.addEventListener('resize', () => {
    const s = computeSize();
    CW = s.w; CH = s.h;
    canvas.width = CW; canvas.height = CH;
    frame.style.width = CW + 'px';
    frame.style.height = CH + 'px';
  });

  const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  if (isTouch) document.getElementById('touchControls').classList.add('show');

  /* ---------- Audio (WebAudio, no assets needed) ---------- */
  let actx = null;
  function ensureAudio(){
    if (!actx) {
      try { actx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch(e){ actx = null; }
    }
  }
  function beep(freq, dur, type='sine', vol=0.18, delay=0){
    if (!actx) return;
    const t0 = actx.currentTime + delay;
    const osc = actx.createOscillator();
    const gain = actx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(vol, t0);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    osc.connect(gain).connect(actx.destination);
    osc.start(t0);
    osc.stop(t0 + dur);
  }
  function sfxCollect(comboLevel){
    beep(520 + comboLevel*40, 0.12, 'triangle', 0.16);
    beep(780 + comboLevel*40, 0.10, 'triangle', 0.10, 0.05);
  }
  function sfxHit(){
    beep(160, 0.22, 'sawtooth', 0.22);
    beep(90, 0.3, 'square', 0.16, 0.05);
  }
  function sfxGameOver(){
    beep(300,0.18,'sawtooth',0.2,0);
    beep(220,0.18,'sawtooth',0.2,0.15);
    beep(140,0.3,'sawtooth',0.22,0.3);
  }
  function sfxStart(){
    beep(440,0.1,'triangle',0.15,0);
    beep(660,0.12,'triangle',0.15,0.1);
    beep(880,0.16,'triangle',0.18,0.2);
  }

  /* ---------- Game State ---------- */
  const state = {
    running:false,
    paused:false,
    over:false,
    score:0,
    best:0,
    lives:3,
    combo:1,
    comboTimer:0,
    time:0,
    spawnTimer:0,
    spawnInterval:1.0,
    speedMult:1,
    shake:0,
    invuln:0,
  };

  const player = {
    x: CW/2, y: CH*0.8, r: 14,
    vx:0, vy:0,
    speed: 320,
    trail: []
  };

  let obstacles = [];
  let gems = [];
  let particles = [];
  let stars = [];

  function initStars(){
    stars = [];
    for(let i=0;i<70;i++){
      stars.push({
        x: Math.random()*CW,
        y: Math.random()*CH,
        r: Math.random()*1.6 + 0.3,
        s: Math.random()*30 + 10,
        tw: Math.random()*Math.PI*2
      });
    }
  }
  initStars();

  /* ---------- Input ---------- */
  const keys = {};
  window.addEventListener('keydown', (e) => {
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
    keys[e.key.toLowerCase()] = true;
    if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') togglePause();
  }, {passive:false});
  window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

  function dirFromKeys(){
    let dx=0, dy=0;
    if (keys['arrowleft'] || keys['a']) dx -= 1;
    if (keys['arrowright'] || keys['d']) dx += 1;
    if (keys['arrowup'] || keys['w']) dy -= 1;
    if (keys['arrowdown'] || keys['s']) dy += 1;
    return {dx,dy};
  }

  // touch buttons
  const touchDir = {dx:0, dy:0};
  function bindHold(id, dx, dy){
    const el = document.getElementById(id);
    const on = (e) => { e.preventDefault(); touchDir.dx = dx; touchDir.dy = dy; ensureAudio(); };
    const off = (e) => { e.preventDefault(); if (touchDir.dx===dx) touchDir.dx=0; if(touchDir.dy===dy) touchDir.dy=0; };
    el.addEventListener('touchstart', on, {passive:false});
    el.addEventListener('touchend', off, {passive:false});
    el.addEventListener('touchcancel', off, {passive:false});
    el.addEventListener('mousedown', on);
    el.addEventListener('mouseup', off);
    el.addEventListener('mouseleave', off);
  }
  bindHold('tLeft', -1, 0);
  bindHold('tRight', 1, 0);
  bindHold('tUp', 0, -1);
  bindHold('tDown', 0, 1);

  // drag-to-move on canvas (mobile alt control)
  let dragging = false;
  canvas.addEventListener('touchstart', (e) => { dragging = true; ensureAudio(); }, {passive:true});
  canvas.addEventListener('touchend', () => { dragging = false; }, {passive:true});
  canvas.addEventListener('touchmove', (e) => {
    if (!dragging || !state.running || state.paused) return;
    const rect = canvas.getBoundingClientRect();
    const t = e.touches[0];
    const tx = (t.clientX - rect.left);
    const ty = (t.clientY - rect.top);
    player.x = Math.max(player.r, Math.min(CW-player.r, tx));
    player.y = Math.max(player.r, Math.min(CH-player.r, ty));
  }, {passive:true});

  /* ---------- Helpers ---------- */
  function rand(a,b){ return a + Math.random()*(b-a); }
  function circleRectHit(cx,cy,cr, rx,ry,rw,rh){
    const nx = Math.max(rx, Math.min(cx, rx+rw));
    const ny = Math.max(ry, Math.min(cy, ry+rh));
    const dx = cx-nx, dy = cy-ny;
    return (dx*dx+dy*dy) < cr*cr;
  }

  function spawnObstacle(){
    const size = rand(26, 46) * (CW/380);
    const x = rand(size, CW-size);
    const speed = rand(90,150) * state.speedMult;
    obstacles.push({x, y:-size, w:size, h:size, speed, rot:rand(0,Math.PI*2), rotSpeed:rand(-2,2)});
  }
  function spawnGem(){
    const r = 10 * (CW/380);
    const x = rand(r+6, CW-r-6);
    const speed = rand(80,120) * state.speedMult;
    gems.push({x, y:-r, r, speed, pulse:Math.random()*Math.PI*2});
  }

  function spawnParticles(x,y,color,count=14){
    for(let i=0;i<count;i++){
      const a = Math.random()*Math.PI*2;
      const sp = rand(60,220);
      particles.push({
        x,y,
        vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
        life: rand(0.35,0.7), t:0,
        color, r: rand(1.5,3.5)
      });
    }
  }

  /* ---------- Lives UI ---------- */
  function renderLives(){
    const el = document.getElementById('lives');
    el.innerHTML = '';
    for(let i=0;i<3;i++){
      const h = document.createElement('div');
      h.className = 'heart' + (i >= state.lives ? ' lost' : '');
      el.appendChild(h);
    }
  }

  /* ---------- Game Flow ---------- */
  function resetGame(){
    state.running = true;
    state.paused = false;
    state.over = false;
    state.score = 0;
    state.lives = 3;
    state.combo = 1;
    state.comboTimer = 0;
    state.time = 0;
    state.spawnTimer = 0;
    state.spawnInterval = 1.0;
    state.speedMult = 1;
    state.shake = 0;
    state.invuln = 1.2;
    player.x = CW/2; player.y = CH*0.8;
    player.trail = [];
    obstacles = [];
    gems = [];
    particles = [];
    renderLives();
    updateHUD();
  }

  function updateHUD(){
    document.getElementById('scoreVal').textContent = Math.floor(state.score);
    document.getElementById('comboVal').textContent = 'x' + state.combo;
  }

  function togglePause(){
    if (!state.running || state.over) return;
    state.paused = !state.paused;
    document.getElementById('pauseScreen').classList.toggle('hidden', !state.paused);
  }

  function endGame(){
    state.running = false;
    state.over = true;
    sfxGameOver();
    if (state.score > state.best) state.best = state.score;
    document.getElementById('finalScore').textContent = Math.floor(state.score);
    document.getElementById('bestScore').textContent = 'Mejor puntaje: ' + Math.floor(state.best);
    document.getElementById('overScreen').classList.remove('hidden');
  }

  /* ---------- Update ---------- */
  let lastT = performance.now();
  function update(dt){
    if (!state.running || state.paused) return;

    state.time += dt;
    state.invuln = Math.max(0, state.invuln - dt);
    state.shake = Math.max(0, state.shake - dt*4);

    // difficulty ramps
    state.speedMult = 1 + state.time * 0.02;
    state.spawnInterval = Math.max(0.32, 1.0 - state.time*0.012);

    // movement
    let {dx,dy} = dirFromKeys();
    if (touchDir.dx !== 0) dx = touchDir.dx;
    if (touchDir.dy !== 0) dy = touchDir.dy;
    const len = Math.hypot(dx,dy) || 1;
    player.vx = (dx/len) * player.speed;
    player.vy = (dy/len) * player.speed;
    player.x += player.vx * dt;
    player.y += player.vy * dt;
    player.x = Math.max(player.r, Math.min(CW-player.r, player.x));
    player.y = Math.max(player.r, Math.min(CH-player.r, player.y));

    player.trail.push({x:player.x, y:player.y});
    if (player.trail.length > 10) player.trail.shift();

    // spawn
    state.spawnTimer += dt;
    if (state.spawnTimer >= state.spawnInterval){
      state.spawnTimer = 0;
      spawnObstacle();
      if (Math.random() < 0.55) spawnGem();
    }

    // combo decay
    if (state.comboTimer > 0){
      state.comboTimer -= dt;
      if (state.comboTimer <= 0) state.combo = 1;
    }

    // score over time
    state.score += dt * 5 * state.combo;

    // obstacles
    for (let i=obstacles.length-1;i>=0;i--){
      const o = obstacles[i];
      o.y += o.speed * dt;
      o.rot += o.rotSpeed * dt;
      if (o.y - o.h > CH){ obstacles.splice(i,1); continue; }
      if (state.invuln <= 0 && circleRectHit(player.x,player.y,player.r*0.85, o.x-o.w/2, o.y-o.h/2, o.w, o.h)){
        obstacles.splice(i,1);
        state.lives -= 1;
        state.combo = 1; state.comboTimer = 0;
        state.shake = 1;
        state.invuln = 1.4;
        renderLives();
        sfxHit();
        spawnParticles(player.x, player.y, '#ff2d95', 20);
        if (state.lives <= 0){ endGame(); return; }
      }
    }

    // gems
    for (let i=gems.length-1;i>=0;i--){
      const g = gems[i];
      g.y += g.speed * dt;
      g.pulse += dt*6;
      if (g.y - g.r > CH){ gems.splice(i,1); continue; }
      const dist = Math.hypot(player.x-g.x, player.y-g.y);
      if (dist < player.r + g.r + 4){
        gems.splice(i,1);
        state.combo = Math.min(9, state.combo + 1);
        state.comboTimer = 3.2;
        state.score += 15 * state.combo;
        sfxCollect(state.combo);
        spawnParticles(g.x, g.y, '#00f0ff', 12);
      }
    }

    // particles
    for (let i=particles.length-1;i>=0;i--){
      const p = particles[i];
      p.t += dt;
      if (p.t >= p.life){ particles.splice(i,1); continue; }
      p.x += p.vx*dt; p.y += p.vy*dt;
      p.vx *= 0.94; p.vy *= 0.94;
    }

    // stars parallax
    for (const s of stars){
      s.y += s.s * dt;
      if (s.y > CH) { s.y = -2; s.x = Math.random()*CW; }
      s.tw += dt*3;
    }

    updateHUD();
  }

  /* ---------- Draw ---------- */
  function drawBackground(){
    ctx.clearRect(0,0,CW,CH);
    const g = ctx.createLinearGradient(0,0,0,CH);
    g.addColorStop(0,'#0d0324');
    g.addColorStop(1,'#050110');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,CW,CH);

    for (const s of stars){
      const alpha = 0.4 + Math.sin(s.tw)*0.3;
      ctx.fillStyle = `rgba(180,220,255,${Math.max(0.1,alpha)})`;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      ctx.fill();
    }

    // subtle grid
    ctx.strokeStyle = 'rgba(0,240,255,0.045)';
    ctx.lineWidth = 1;
    const grid = 40;
    for (let x=0;x<CW;x+=grid){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,CH); ctx.stroke(); }
    for (let y=0;y<CH;y+=grid){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(CW,y); ctx.stroke(); }
  }

  function drawPlayer(){
    // trail
    for (let i=0;i<player.trail.length;i++){
      const t = player.trail[i];
      const a = (i/player.trail.length) * 0.25;
      ctx.fillStyle = `rgba(0,240,255,${a})`;
      ctx.beginPath();
      ctx.arc(t.x, t.y, player.r*0.7*(i/player.trail.length), 0, Math.PI*2);
      ctx.fill();
    }

    const blink = state.invuln > 0 && Math.floor(state.time*20)%2===0;
    if (blink) return;

    ctx.save();
    ctx.shadowBlur = 22;
    ctx.shadowColor = '#00f0ff';
    const grad = ctx.createRadialGradient(player.x,player.y,2,player.x,player.y,player.r);
    grad.addColorStop(0,'#ffffff');
    grad.addColorStop(0.4,'#00f0ff');
    grad.addColorStop(1,'#0077aa');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.r, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  function drawObstacles(){
    for (const o of obstacles){
      ctx.save();
      ctx.translate(o.x, o.y);
      ctx.rotate(o.rot);
      ctx.shadowBlur = 16;
      ctx.shadowColor = '#ff2d95';
      const grad = ctx.createLinearGradient(-o.w/2,-o.h/2,o.w/2,o.h/2);
      grad.addColorStop(0,'#ff2d95');
      grad.addColorStop(1,'#8a0a4d');
      ctx.fillStyle = grad;
      ctx.fillRect(-o.w/2,-o.h/2,o.w,o.h);
      ctx.strokeStyle = 'rgba(255,255,255,0.25)';
      ctx.strokeRect(-o.w/2,-o.h/2,o.w,o.h);
      ctx.restore();
    }
  }

  function drawGems(){
    for (const g of gems){
      const pulse = 1 + Math.sin(g.pulse)*0.15;
      ctx.save();
      ctx.translate(g.x, g.y);
      ctx.shadowBlur = 18;
      ctx.shadowColor = '#ffe93f';
      ctx.fillStyle = '#ffe93f';
      ctx.beginPath();
      const r = g.r*pulse;
      ctx.moveTo(0,-r);
      ctx.lineTo(r*0.8,0);
      ctx.lineTo(0,r);
      ctx.lineTo(-r*0.8,0);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
  }

  function drawParticles(){
    for (const p of particles){
      const a = 1 - (p.t/p.life);
      ctx.fillStyle = p.color.replace(')', '').replace('rgb','rgba') ;
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  function render(){
    ctx.save();
    if (state.shake > 0){
      const mag = state.shake*8;
      ctx.translate(rand(-mag,mag), rand(-mag,mag));
    }
    drawBackground();
    drawGems();
    drawObstacles();
    drawParticles();
    drawPlayer();
    ctx.restore();
  }

  /* ---------- Main loop ---------- */
  function loop(now){
    const dt = Math.min(0.033, (now - lastT)/1000);
    lastT = now;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  /* ---------- Buttons ---------- */
  document.getElementById('startBtn').addEventListener('click', () => {
    ensureAudio(); sfxStart();
    document.getElementById('startScreen').classList.add('hidden');
    resetGame();
  });
  document.getElementById('resumeBtn').addEventListener('click', togglePause);
  document.getElementById('retryBtn').addEventListener('click', () => {
    ensureAudio(); sfxStart();
    document.getElementById('overScreen').classList.add('hidden');
    resetGame();
  });

})();
</script>
</body>
</html>
